<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習用デモ（PJ-google-demo）</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css" />    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/6f90a8d84f.js" crossorigin="anonymous"></script>

</head>

<body>
    <div class="demo">
        <p>※これは学習用に作成したUI模写のデモページです。実際のGoogleとは一切関係がありません。</p>
    </div>

    <div class="title">
        <h1>Google </h1>
        <span>(練習用模写)</span>
    </div>

    <form action="" class="search-form">
        <i class="fa-solid fa-magnifying-glass icon"></i>
        <input type="text" placeholder="学習用デモgoogleで検索またはURLを入力">
        <button type="button" class="search-btn" data-tooltip="音声検索">
            <i class="fa-solid fa-microphone"></i>
        </button>
        <button type="button" class="search-btn" data-tooltip="画像で検索">
            <i class="fa-solid fa-camera"></i>
        </button>
        <button type="button" class="AIsearch-btn" data-tooltip="google検索のAIモードに質問する">
            <i class="fa-brands fa-sistrix"></i><span>AIモード</span>
        </button>
        <!-- 
        「<input>」入力欄
        「<input placeholder="">」入力前に薄く表示される説明
        「<button data-tooltip="">ツールチップ（マウスオンしたら出てくる注釈）」
        -->
    </form>

    <div class="shortcut">
        <i class="fa-solid fa-circle-plus"></i>
        <span>ショートカット...</span>
    </div>

    <div class="shortcut-popup">
        <h2>ショートカットを追加</h2>
        <label class="shortcut-label" for="name-label">名前</label>
        <input type="text" id="name-label">

        <label class="shortcut-label" for="url-label">URL</label>
        <input type="url" id="url-label">
        <!-- 
        「<label for="">,<input id="">」同じ内容を書くと紐付けできる（文字(label)をクリックすると、ボタンが押されたとinputが認識する）
        -->
        <button type="button" class="cancel-btn">キャンセル</button>
        <button type="button" class="done-btn">完了</button>
    </div>

</body>
</html>
